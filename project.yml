name: SpeechEditor
options:
  bundleIdPrefix: com.baha.speecheditor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  SpeechEditor:
    type: application
    platform: macOS
    sources: [SpeechEditor]
    settings:
      base:
        INFOPLIST_FILE: SpeechEditor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpeechEditor/SpeechEditor.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
  SpeechEditorTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SpeechEditorTests]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpeechEditor
  SpeechEditorUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [SpeechEditorUITests]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpeechEditor
schemes:
  SpeechEditor:
    build:
      targets:
        SpeechEditor: all
        SpeechEditorTests: [test]
        SpeechEditorUITests: [test]
    test:
      targets: [SpeechEditorTests, SpeechEditorUITests]
